name: Build BATIR

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: msbuild src/BATIR/BATIR.csproj /t:Restore /p:Configuration=Release

      - name: Build BATIR
        run: msbuild src/BATIR/BATIR.csproj /p:Configuration=Release /p:Platform="Any CPU" /p:Restore=false

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item -Recurse -Force src/BATIR/bin/Release/* release/
          Compress-Archive -Path release/* -DestinationPath BATIR-Windows.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BATIR-Windows
          path: BATIR-Windows.zip