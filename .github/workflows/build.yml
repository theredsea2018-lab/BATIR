name: Build BATIR

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Repair legacy source syntax
        shell: pwsh
        run: |
          $path = "src/BATIR/MainForm.cs"
          $text = Get-Content -Raw -Encoding UTF8 $path
          $pattern = 'new SqliteParameter\("@factor", \(long\)unitFactor\.Value\)\)\);'
          $replacement = 'new SqliteParameter("@factor", (long)unitFactor.Value));'
          $fixed = [regex]::Replace($text, $pattern, $replacement)
          if ($fixed -ne $text) {
            Set-Content -Path $path -Value $fixed -Encoding UTF8 -NoNewline
            Write-Host "Applied syntax repair to MainForm.cs"
          }
          if ((Get-Content -Raw -Encoding UTF8 $path).Contains('new SqliteParameter("@factor", (long)unitFactor.Value)));')) {
            throw "MainForm.cs still contains the known invalid SqliteParameter syntax."
          }

      - name: Restore NuGet packages
        run: msbuild src/BATIR/BATIR.csproj /t:Restore /p:Configuration=Release

      - name: Build BATIR
        run: msbuild src/BATIR/BATIR.csproj /p:Configuration=Release /p:Platform="Any CPU" /p:Restore=false

      - name: Database smoke test
        run: '& "src/BATIR/bin/Any CPU/Release/BATIR.exe" --self-test'

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer-output | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "installer\BATIR.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "installer-output/BATIR-Setup.exe")) { throw "BATIR-Setup.exe was not produced." }

      - name: Package portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item -Recurse -Force "src/BATIR/bin/Any CPU/Release/*" release/
          Compress-Archive -Path release/* -DestinationPath BATIR-Windows-Portable.zip -Force
          if (-not (Test-Path "BATIR-Windows-Portable.zip")) { throw "Portable ZIP was not produced." }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BATIR-Windows
          path: |
            BATIR-Windows-Portable.zip
            installer-output/BATIR-Setup.exe
