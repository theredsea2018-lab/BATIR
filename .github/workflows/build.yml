name: Build BATIR

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: msbuild src/BATIR/BATIR.csproj /t:Restore /p:Configuration=Release

      - name: Build BATIR
        run: msbuild src/BATIR/BATIR.csproj /p:Configuration=Release /p:Platform="Any CPU" /p:Restore=false

      - name: Database smoke test
        run: '& "src/BATIR/bin/Any CPU/Release/net48/BATIR.exe" --self-test'

      - name: Operational 100 smoke test
        run: '& "src/BATIR/bin/Any CPU/Release/net48/BATIR.exe" --self-test-100'

      - name: Operational 500 smoke test
        run: '& "src/BATIR/bin/Any CPU/Release/net48/BATIR.exe" --self-test-500'

      - name: Stage 6 Windows smoke test
        shell: pwsh
        run: .\tests\Stage6SmokeTest.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer-output | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "installer\BATIR.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "installer-output/BATIR-Setup.exe")) { throw "BATIR-Setup.exe was not produced." }

      - name: Package portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item -Recurse -Force "src/BATIR/bin/Any CPU/Release/net48/*" release/
          Compress-Archive -Path release/* -DestinationPath BATIR-Windows-Portable.zip -Force
          if (-not (Test-Path "BATIR-Windows-Portable.zip")) { throw "Portable ZIP was not produced." }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BATIR-Windows
          path: |
            BATIR-Windows-Portable.zip
            installer-output/BATIR-Setup.exe
